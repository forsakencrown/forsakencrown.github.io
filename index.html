<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="https://i.postimg.cc/4xWLj9nt/dsah.png" sizes="32x32">
<link rel="icon" href="https://i.postimg.cc/4xWLj9nt/dsah.png" sizes="64x64">
  
<meta charset="UTF-8">
<title>Forsaken Crown</title>

<style>
  body {
    margin: 0;
    background: #272727;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: serif;
  }

  /* Floating animation */
  @keyframes gentleFloat {
    0% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0); }
  }

  .book {
    width: 260px;
    max-width: 70vw;
    animation: gentleFloat 4s ease-in-out infinite;
    transition: transform 0.3s ease;
    border-radius: 8px;
  }

  .book:hover {
    transform: translateY(-18px);
  }

  a {
    display: inline-block;
  }

  /* UNIVERSAL MOBILE FIXES */
@media (max-width: 700px) {

  /* Reduce page padding */
  .bio-wrapper,
  .verses-wrapper,
  .connections-wrapper,
  .rules-wrapper {
    padding: 20px 14px;
    gap: 28px;
  }

  /* Make floating top images scale better */
  .bio-top-img {
    width: 90%;
    max-width: none;
  }

  /* Make titles smaller but still magical */
  .verses-title,
  .connections-title,
  .rules-title {
    font-size: 2.2rem;
    letter-spacing: 2px;
  }

  /* Fix grids so they stack cleanly */
  .image-grid {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .connections-grid {
    grid-template-columns: 1fr 1fr;
  }

  .verses-grid {
    grid-template-columns: 1fr;
  }

  /* Fix stat columns */
  .stats-two-col {
    grid-template-columns: 1fr;
    padding: 20px;
  }

  .stat-row {
    flex-direction: column;
    text-align: left;
  }

  .stat-value {
    max-width: 100%;
    text-align: left;
  }

  /* Fix connection banners */
  .connection-banner {
    height: 120px;
    object-fit: cover;
  }

  /* Fix verse boxes */
  .verse-box {
    padding: 18px;
  }

  /* Make text more readable on small screens */
  .verse-text,
  .connection-info,
  .bio-parchment {
    font-size: 0.95rem;
    line-height: 1.55;
  }
}

</style>
</head>

<body>

  <a href="nav.html">
    <img src="https://i.postimg.cc/4xWLj9nt/dsah.png" class="book" alt="Floating Book">
  </a>

</body>
</html>
