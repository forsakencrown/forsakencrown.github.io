<!DOCTYPE html>
<html lang="en">

    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 80px;
  }

  h1 {

    font-size: 2.4rem;
    margin-bottom: 40px;
    letter-spacing: 1px;
  }

    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 90%;
    max-width: 400px;
  }

  .nav-button {

    border: 2px solid #537151;
    color: #e8e8e8;
    padding: 14px 20px;
    text-align: center;
    font-size: 1.2rem;
    text-decoration: none;
    border-radius: 10px;
    transition: all 0.3s ease;
  }

  .nav-button:hover {
    background: #537151;
    color: #ffffff;
    transform: translateY(-6px);

  .back {
    margin-top: 40px;
    font-size: 1rem;
    color: #6b8a63;
    text-decoration: none;
    transition: 0.3s;
