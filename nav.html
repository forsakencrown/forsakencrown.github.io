<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forsaken Crown • Navigation</title>

<style>
  body {
    margin: 0;
    background: #272727;
    color: #e8e8e8;
    font-family: serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  /* Header image */
  .header-img {
    width: 90%;
    max-width: 600px;
    border-radius: 10px;
    margin-bottom: 30px;
    animation: gentleFloat 4s ease-in-out infinite;
  }

  /* Floating animation */
  @keyframes gentleFloat {
    0% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0); }
  }

  /* Description block */
  .desc {
    max-width: 600px;
    text-align: center;
    font-size: 1.1rem;
    line-height: 1.6;
    margin-bottom: 40px;
    color: #dcdcdc;
  }

  /* Button grid */
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    width: 100%;
    max-width: 700px;
  }

  /* Buttons */
  .nav-button {
    background: #537151;
    color: #ffffff;
    padding: 14px 10px;
    text-align: center;
    font-size: 1rem;
    text-decoration: none;
    border-radius: 8px;
    box-shadow: 0 0 12px #6b8a63;
    transition: all 0.3s ease;
  }

  .nav-button:hover {
    transform: translateY(-6px);
    box-shadow: 0 0 18px #8fbf7a;
  }
</style>
</head>

<body>

  <!-- Header image -->
  <img src="YOUR-HEADER-IMAGE-URL-HERE" class="header-img" alt="Forsaken Crown Header">

  <!-- Description -->
  <div class="desc">
    AN INDIE THEODORE ATWELL, AN ORIGINAL CHARACTER OF ORIGINAL LORE.<br>
    LOVINGLY CRAFTED BY BELLE.<br>
    THIS BLOG WILL ONLY WRITE WITH THOSE 21+.
  </div>

  <!-- Button grid -->
  <div class="nav-grid">
    <a href="blog.html" class="nav-button">Blog</a>
    <a href="codex.html" class="nav-button">Codex</a>
    <a href="biography.html" class="nav-button">Biography</a>
    <a href="timelines.html" class="nav-button">Timelines</a>
    <a href="connections.html" class="nav-button">Connections</a>
    <a href="memes.html" class="nav-button">Memes</a>
    <a href="wishlist.html" class="nav-button">Wishlist</a>
    <a href="headcanon.html" class="nav-button">Headcanon</a>
  </div>

</body>
</html>
