<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="https://i.postimg.cc/4xWLj9nt/dsah.png" sizes="32x32">

<meta charset="UTF-8">
<title>Forsaken Crown • Navigation</title>

<style>
  body {
    background: #272727;
    margin: 0;
    padding: 0;
    font-family: "Cormorant Garamond", serif;
  }

  .nav-wrapper {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    gap: 30px;
    box-sizing: border-box;
  }

  /* Floating banner animation */
  @keyframes floatBanner {
    0% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
    100% { transform: translateY(0); }
  }

  .nav-banner {
    width: 45%;
    max-width: 450px;
    border-radius: 10px;
    animation: floatBanner 5s ease-in-out infinite;
    opacity: 0.95;
    display: block;
    margin: 0 auto;
  }

  .nav-description {
    max-width: 700px;
    color: #d9e6d9;
    font-size: 0.95rem;
    line-height: 1.55;
    text-align: justify;
    text-align-last: center;
  }

  /* Two-column layout centered */
  .nav-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 18px;
    width: 100%;
    max-width: 550px;
    justify-items: center;
  }

  /* Magical shimmer animation */
  @keyframes shimmer {
    0% { opacity: 0.15; }
    50% { opacity: 0.35; }
    100% { opacity: 0.15; }
  }

  /* Click flash */
  @keyframes spellFlash {
    0% { box-shadow: 0 0 0 rgba(215,235,215,0); }
    50% { box-shadow: 0 0 18px rgba(215,235,215,0.55); }
    100% { box-shadow: 0 0 0 rgba(215,235,215,0); }
  }

  .nav-buttons a {
    position: relative;
    padding: 10px 16px;
    background: linear-gradient(145deg, #3f5a3f, #537151);
    color: #e8f2e8;
    text-decoration: none;
    border-radius: 10px;

    box-shadow:
      inset 0 0 6px rgba(0,0,0,0.45),
      inset 0 0 2px rgba(255,255,255,0.15),
      0 2px 4px rgba(0,0,0,0.45);

    border: 1px solid rgba(215, 235, 215, 0.25);

    font-size: 0.95rem;
    letter-spacing: 1.3px;

    transition: transform 0.25s ease, background 0.25s ease;
    overflow: hidden;
    text-align: center;
    width: 100%;
    box-sizing: border-box;
  }

  /* Larger, more visible runes with shimmer */
  .nav-buttons a::before {
    content: attr(data-rune);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 4rem;
    opacity: 0.32;
    color: #e4f0e4;
    pointer-events: none;
    filter: blur(0.4px);
    animation: shimmer 3s ease-in-out infinite;
  }

  /* Hover glow */
  .nav-buttons a:hover {
    background: linear-gradient(145deg, #537151, #6b8a63);
    transform: translateY(-6px);
    box-shadow:
      inset 0 0 10px rgba(0,0,0,0.35),
      0 5px 10px rgba(0,0,0,0.55);
  }

  /* Click flash */
  .nav-buttons a:active {
    animation: spellFlash 0.45s ease-out;
  }

  @media (max-width: 600px) {
    .nav-banner {
      width: 80%;
    }
    .nav-buttons {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<div class="nav-wrapper">

  <!-- Floating top banner -->
  <img 
    src="https://i.postimg.cc/mrKDgyTj/promo-2.png"
    alt="Banner"
    class="nav-banner"
  >

  <div class="nav-description">
    AN INDIE <b>THEODORE ATWELL</b>, AN <i>ORIGINAL CHARACTER</i> OF <i>ORIGINAL LORE</i>.
    <br>LOVINGLY CRAFTED BY BELLE. THIS BLOG WILL ONLY WRITE WITH THOSE 21+.
  </div>

  <!-- Two-column rune spell tabs -->
  <div class="nav-buttons">

    <a href="rules/" data-rune="ᛃ">CODEX</a>
    <a href="biography/" data-rune="ᚱ">BIOGRAPHY</a>
    <a href="verses/" data-rune="ᛇ">TIMELINES</a>
    <a href="mains/" data-rune="ᚹ">CONNECTIONS</a>
    <a href="memes.html" data-rune="ᛞ">MEMES</a>
    <a href="wishlist.html" data-rune="ᚾ">WISHLIST</a>
    <a href="headcanon.html" data-rune="ᛉ">HEADCANON</a>
  </div>

</div>

</body>
</html>
